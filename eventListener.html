</head>
<body>
    <h2>a=5, b=7 <br><span id="result">0</span></h2>
    <button id="addBtn" onclick="add()">Addition</button>
    <button id="subBtn" onclick="sub()">Subtraction</button>
    <button id="multBtn" onclick="multiply()">Multiply</button>
    <button id="divBtn" onclick="divide()">Divide</button>
    <button id="resetBtn" onclick="reset()">Reset</button>
</body>
<script>

    let a =5
    let b =7

    function reset(){
        document.getElementById("result").innerHTML = "0"
        alert("Reset Successful")
    }

    addBtn.addEventListener("click",function(){
        document.getElementById("result").innerHTML = "a+b = " + (a + b)
    })

    subBtn.addEventListener("click",function(){
        document.getElementById("result").innerHTML = "a-b = " + (a - b)
    })

    multBtn.addEventListener("click",function(){
        document.getElementById("result").innerHTML = "a*b = " + (a * b)
    })
    
    divBtn.addEventListener("click",function(){
        document.getElementById("result").text = "<i>a/b = ${a / b}</i>";
        document.getElementById("result").innerHTML = "<i>a/b = ${a / b}</i>";
    })

    resetBtn.addEventListener("click",reset)

</script>
